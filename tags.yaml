# Tag vocabulary. Every feed in feeds/*.yaml carries one or more of these ids
# (`tags: [claude, ai-coding]`); the config builder's first step shows them as
# the chips a newcomer picks from ("what do you follow?"). Keep ids short and
# stable — they are referenced from the data and from shared builder links.
#
# group: how the chips are laid out on the page. label_ja / label_en: chip text.
- id: claude
  group: ai
  label_en: Claude / Anthropic
  label_ja: Claude・Anthropic
- id: claude-code
  group: ai
  label_en: Claude Code
  label_ja: Claude Code
