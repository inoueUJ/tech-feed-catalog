<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tech-feed-catalog — 朝ラジオの設定を 3 分で</title>
<meta name="description" content="Pick the technologies you follow, group them into shows, set your mornings — and download a complete notebooklm-radio config.yaml. A curated, weekly-validated catalog of developer feeds underneath.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
<style>
:root {
  --bg: #fbfaf7;
  --surface: #ffffff;
  --surface-2: #f4f2ed;
  --border: #e2ded4;
  --border-strong: #c9c3b5;
  --text: #1c1a17;
  --text-dim: #6b655c;
  --text-faint: #948d81;
  --accent: #b4560f;
  --accent-soft: #fdf0e4;
  --ok: #3f7d3f;
  --ok-soft: #e6f2e6;
  --warn: #9a6b12;
  --warn-soft: #fbf3df;
  --bad: #a33a2a;
  --bad-soft: #fbe9e5;
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16150f; --surface: #1e1d16; --surface-2: #26241c; --border: #35322a; --border-strong: #4b4740;
    --text: #efece4; --text-dim: #a9a397; --text-faint: #7c766b; --accent: #e8944a; --accent-soft: #2e2317;
    --ok: #7db87d; --ok-soft: #1d2d1d; --warn: #d0a44a; --warn-soft: #2c2616; --bad: #e0705e; --bad-soft: #301c18;
  }
}
:root[data-theme="dark"] {
  --bg: #16150f; --surface: #1e1d16; --surface-2: #26241c; --border: #35322a; --border-strong: #4b4740;
  --text: #efece4; --text-dim: #a9a397; --text-faint: #7c766b; --accent: #e8944a; --accent-soft: #2e2317;
  --ok: #7db87d; --ok-soft: #1d2d1d; --warn: #d0a44a; --warn-soft: #2c2616; --bad: #e0705e; --bad-soft: #301c18;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: .92em; }
button { font-family: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
.narrow { max-width: 900px; margin: 0 auto; padding: 0 20px; }
[hidden] { display: none !important; }

header.site { border-bottom: 1px solid var(--border); background: var(--surface); padding: 22px 0 18px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 21px; margin: 0; letter-spacing: -0.01em; font-family: var(--mono); }
h1 .dot { color: var(--accent); }
.count { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.tagline { margin: 8px 0 0; color: var(--text-dim); font-size: 14px; max-width: 70ch; }
.tagline strong { color: var(--text); font-weight: 600; }
.header-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.header-links { display: flex; gap: 16px; font-size: 13px; flex-wrap: wrap; }
.switches { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--text-dim); font-size: 12.5px; padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.linkbtn { background: none; border: none; color: var(--text-faint); font-size: 12px; cursor: pointer; padding: 0; }
.linkbtn:hover { color: var(--accent); text-decoration: underline; }

/* ---------- guided ---------- */
.guided { padding: 26px 0 90px; display: grid; gap: 22px; }
.intro { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 26px 26px 22px; display: grid; gap: 12px; }
.intro h2 { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
.intro p { margin: 0; color: var(--text-dim); max-width: 60ch; }
.intro .cta { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.btn { padding: 10px 18px; border-radius: 999px; font-size: 14px; cursor: pointer; font-weight: 600; background: var(--accent); color: #fff; border: 1px solid var(--accent); }
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn { color: #16150f; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn { color: #fff; } }
.btn.ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.big { padding: 12px 24px; font-size: 15px; }

.progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.progress button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; display: grid; gap: 6px; color: var(--text-dim); font-size: 12.5px; }
.progress .bar { height: 4px; border-radius: 3px; background: var(--border); }
.progress button[data-state="done"] .bar { background: var(--ok); }
.progress button[data-state="current"] .bar { background: var(--accent); }
.progress button[data-state="current"] { color: var(--text); font-weight: 600; }
.progress .lbl { display: flex; align-items: center; gap: 6px; }
.progress .chk { width: 14px; height: 14px; flex: none; }
.progress .chk path { fill: none; stroke: var(--ok); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
.progress button[data-state="done"] .chk path { animation: draw .35s ease-out forwards; }
.progress button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; display: grid; gap: 16px; }
.card h2 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
.card .lead { margin: 0; color: var(--text-dim); font-size: 14px; max-width: 64ch; }
.stepnum { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; }
.stephead { display: grid; gap: 4px; }
.status { position: sticky; top: 10px; z-index: 5; justify-self: end; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 12px; box-shadow: 0 4px 16px rgb(0 0 0 / 8%); }
.status b { font-variant-numeric: tabular-nums; display: inline-block; }
.status b.bump { animation: bump .32s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: var(--accent); } 100% { transform: scale(1); } }

.tgroup { display: grid; gap: 8px; }
.tgroup h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }
.tchips { display: flex; flex-wrap: wrap; gap: 8px; }
.tchip { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); padding: 7px 13px; border-radius: 999px; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: border-color .15s, background .15s; }
.tchip .n { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
.tchip:hover { border-color: var(--accent); }
.tchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tchip[aria-pressed="true"] .n { color: rgb(255 255 255 / 75%); }
:root[data-theme="dark"] .tchip[aria-pressed="true"], :root:not([data-theme="light"]) .tchip[aria-pressed="true"] { color: #16150f; }
:root[data-theme="dark"] .tchip[aria-pressed="true"] .n, :root:not([data-theme="light"]) .tchip[aria-pressed="true"] .n { color: rgb(22 21 15 / 65%); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .tchip[aria-pressed="true"] { color: #fff; } :root:not([data-theme="dark"]) .tchip[aria-pressed="true"] .n { color: rgb(255 255 255 / 75%); } }
.tchip[aria-pressed="mixed"] { border-color: var(--accent); background: var(--accent-soft); }
.tchip.pop { animation: pop .3s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
.tchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.packrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.pack { text-align: left; display: grid; gap: 2px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; }
.pack b { font-size: 13.5px; }
.pack span { font-size: 11.5px; color: var(--text-dim); line-height: 1.4; }
.pack:hover { border-color: var(--accent); }
.pack[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pack[aria-pressed="mixed"] { border-color: var(--accent); border-style: dashed; }
.pack.pop { animation: pop .3s cubic-bezier(.3,1.6,.5,1); }
.pack:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.custom-note { font-size: 11.5px; color: var(--accent); }
.nb-adv .field span { font-size: 11.5px; color: var(--text-dim); }
.intro .loaded { font-size: 13px; color: var(--text); background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.picked { display: grid; gap: 8px; border-top: 1px solid var(--border); padding-top: 14px; }
.picked h3 { margin: 0; font-size: 13px; color: var(--text-dim); font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 6px 3px 10px; }
.pill .x { border: 0; background: none; cursor: pointer; color: var(--text-faint); font-size: 14px; line-height: 1; padding: 0 4px; border-radius: 999px; }
.pill .x:hover { color: var(--bad); }
.pill.in { animation: pop .3s cubic-bezier(.3,1.6,.5,1); }
.pill .flag { color: var(--warn); font-size: 11px; }

.custom { border: 1px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface-2); padding: 14px 16px; display: grid; gap: 8px; }
.custom h3 { font-size: 14px; margin: 0; }
.custom p { margin: 0; font-size: 12.5px; color: var(--text-dim); }
.custom-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.custom-row select, .custom-row input[type="text"] { padding: 7px 10px; font-size: 13px; font-family: inherit; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); color: var(--text); }
.custom-row input[type="text"] { flex: 1 1 200px; min-width: 0; font-family: var(--mono); }
.custom-result { font-size: 12.5px; min-height: 1.4em; overflow-wrap: anywhere; }
.custom-result .ok { color: var(--ok); }
.custom-result .bad { color: var(--bad); }
.btn-sm { padding: 6px 11px; font-size: 12.5px; cursor: pointer; font-weight: 600; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 7px; }
.btn-sm:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-sm:disabled { opacity: .45; cursor: default; }
.btn-sm.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn-sm.primary, :root:not([data-theme="light"]) .btn-sm.primary { color: #16150f; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn-sm.primary { color: #fff; } }

.nb { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); display: grid; gap: 8px; }
.nb-head { display: flex; align-items: center; gap: 8px; }
.nb-head input { flex: 1; min-width: 0; padding: 6px 10px; font-size: 15px; font-weight: 700; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); font-family: inherit; }
.nb-head .n { font-size: 12px; color: var(--text-faint); white-space: nowrap; }
.nb-feed { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.nb-feed .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nb-feed select { font-size: 12px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); color: var(--text-dim); max-width: 140px; font-family: inherit; }
.nb-feed label { font-size: 11.5px; color: var(--text-faint); display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; }
.nb-feed input[type="checkbox"] { accent-color: var(--accent); margin: 0; }
.nb-style { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--text-dim); }
.nb-adv { display: grid; gap: 6px; }
.nb-adv summary { font-size: 12.5px; color: var(--text-dim); cursor: pointer; }
.nb-audio { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.nb-audio select, .nb textarea, .basics select, .basics input { width: 100%; padding: 6px 9px; font-size: 13px; font-family: inherit; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); }
.nb textarea { min-height: 70px; resize: vertical; font-size: 12.5px; line-height: 1.45; }
.nbgrid { display: grid; gap: 10px; }
.explain { font-size: 12.5px; color: var(--text-dim); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }

.basics .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.basics .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .basics .row, .basics .row3 { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12.5px; color: var(--text-dim); }
.inline { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-dim); }
.inline input[type="checkbox"] { width: auto; accent-color: var(--accent); margin: 0; }
.quota { font-size: 13.5px; padding: 10px 12px; border-radius: 8px; background: var(--ok-soft); border: 1px solid var(--ok); margin-top: 10px; }
.quota.over { background: var(--bad-soft); border-color: var(--bad); }
.quota b { font-variant-numeric: tabular-nums; }

.warnings { margin: 0; padding: 0; list-style: none; font-size: 12.5px; display: grid; gap: 5px; }
.warnings li { padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim); }
.warnings li.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--text); }
.warnings li.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--text); }

.done-hero { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 6px 0 4px; }
.done-hero .ring { width: 64px; height: 64px; }
.done-hero .ring circle { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 2; }
.done-hero .ring path { fill: none; stroke: var(--ok); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .5s .1s ease-out forwards; }
.outputs { display: grid; gap: 16px; }
.out { display: grid; gap: 8px; }
.out .oh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.out .oh strong { font-size: 14px; }
.out .oh .acts { display: flex; gap: 6px; }
pre { margin: 0; padding: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; max-height: 300px; overflow: auto; white-space: pre; }
.next { display: grid; gap: 6px; font-size: 14px; }
.next ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.navrow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.banner { font-size: 13px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; }

/* ---------- list mode ---------- */
.controls { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 12px 0; }
.control-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 14px; font-family: inherit; }
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-dim); padding: 5px 11px; border-radius: 999px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
:root[data-theme="dark"] .chip[aria-pressed="true"], :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #16150f; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .chip[aria-pressed="true"] { color: #fff; } }
.chip .n { opacity: .65; margin-left: 5px; font-variant-numeric: tabular-nums; }
.layout { display: grid; grid-template-columns: minmax(0,1fr) 430px; gap: 28px; align-items: start; padding: 24px 0 80px; }
@media (max-width: 960px) { .layout { grid-template-columns: 1fr; padding-bottom: 120px; } }
.group-head { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.group-head:first-child { margin-top: 0; }
.group-head h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); }
.group-head .ja { font-size: 12px; color: var(--text-faint); }
.feed { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 11px 13px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-bottom: 7px; cursor: pointer; }
.feed:hover { border-color: var(--border-strong); }
.feed.on { border-color: var(--accent); background: var(--accent-soft); }
.feed input { margin: 4px 0 0; width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.feed-name { font-weight: 600; font-size: 14.5px; }
.feed-meta { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 3px; font-size: 12px; color: var(--text-dim); }
.feed-meta .sep { color: var(--border-strong); }
.stars { color: var(--accent); letter-spacing: -1px; }
.stars .off { color: var(--border-strong); }
.tag { font-family: var(--mono); font-size: 11px; background: var(--surface-2); border: 1px solid var(--border); padding: 0 5px; border-radius: 4px; color: var(--text-dim); }
.warnflag { color: var(--warn); }
.feed-links { display: flex; gap: 8px; font-size: 12px; white-space: nowrap; }
.feed-links a { color: var(--text-faint); text-decoration: none; }
.feed-links a:hover { color: var(--accent); text-decoration: underline; }
.panel { position: sticky; top: 78px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 92px); }
.panel-toggle { display: none; }
@media (max-width: 960px) {
  .panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 30; border-radius: 12px 12px 0 0; border-bottom: none; box-shadow: 0 -10px 30px rgb(0 0 0 / 22%); max-height: 84vh; transform: translateY(100%); transition: transform .22s ease; }
  .panel.has-sel { transform: translateY(calc(100% - 53px)); }
  .panel.has-sel.open { transform: translateY(0); }
  .panel-head { cursor: pointer; }
  .panel-toggle { display: inline; color: var(--text-faint); font-size: 12px; }
}
.panel-head { padding: 13px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex: none; }
.panel-head strong { font-size: 14px; }
.panel-body { overflow-y: auto; flex: 1 1 auto; min-height: 0; display: grid; gap: 12px; padding: 12px 14px 14px; align-content: start; }
.formats { display: flex; gap: 0; }
.formats button { flex: 1; padding: 6px 4px; font-size: 12px; cursor: pointer; background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); border-right: none; }
.formats button:first-child { border-radius: 6px 0 0 6px; }
.formats button:last-child { border-radius: 0 6px 6px 0; border-right: 1px solid var(--border); }
.formats button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; border-color: var(--border-strong); }
.sec h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); }
.panel-actions { display: flex; gap: 8px; }
.panel-actions .btn { flex: 1; border-radius: 7px; padding: 9px; font-size: 13px; }
.hint { font-size: 11.5px; color: var(--text-faint); line-height: 1.5; }

}
const topicsInUse = () => [...new Set(selectedEntries().map(e => e.topic))];
function nbFor(topic) { if (!S.notebooks[topic]) S.notebooks[topic] = { format: 'deep-dive', length: 'long', prompt: '' }; return S.notebooks[topic]; }

  else { const v = S.sel.get(key); if (v) v.latest = on; }

  for (const c of S.custom) if (c.topic === from) c.topic = to;

const tagFeeds = (id) => S.data.feeds.filter(f => (f.tags || []).includes(id));
function tagState(id) {

  return n === 0 ? 'false' : n === feeds.length ? 'true' : 'mixed';

    const others = S.data.tags.filter(tg => tg.id !== id && tagState(tg.id) === 'true').map(tg => tg.id);

function validTz(tz) { try { Intl.DateTimeFormat(undefined, { timeZone: tz }); return true; } catch { return false; } }
function tzOffsetMinutes(tz, date = new Date()) {

function activeRuns() { const b = S.basics, r = []; if (/^\d\d:\d\d$/.test(b.run1)) r.push(b.run1); if (b.run2on && /^\d\d:\d\d$/.test(b.run2)) r.push(b.run2); return r; }

  L.push('# Replace your whole config.yaml with this file, then check it: python radio_batch.py --check-config');

function computeWarnings() {

  for (const r of activeRuns()) { const m = Number(r.split(':')[1]); if (m % 30 === 0) warn(t('w_congested', r, r.slice(0, 3) + String((m + 5) % 60).padStart(2, '0'))); }
  for (const e of entries) {
    const m = e.meta || {};
    if (m.unchecked) info(t('w_unchecked', e.name));
    if (m.status === 'broken') bad(t('w_broken', e.name));
    if (m.status === 'blocked') bad(t('w_blocked', e.name));
    if (m.status === 'stale') warn(t('w_stale', e.name));
    if (e.source_mode === 'text') info(t('w_text', e.name));
    if (m.has_timestamps === false) info(t('w_nots', e.name));
    const vol = volumeNumber(m.volume), capacity = perFeed * runs * 30;

}

function bindNotebooks(root, rerender) {
  root.querySelectorAll('[data-rename]').forEach(input => {
    input.onchange = () => { renameTopic(input.dataset.rename, input.value); rerender(); };
    input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } };
  });
  root.querySelectorAll('[data-move]').forEach(sel => sel.onchange = () => {
    const isNew = sel.value === '__new__', to = isNew ? newTopicName() : sel.value;
    setTopic(sel.dataset.move, to); rerender();
    if (isNew) { const box = document.querySelector(`.nb[data-topic="${CSS.escape(to)}"] [data-rename]`); if (box) { box.focus(); box.select(); } }
  });
  root.querySelectorAll('[data-latest]').forEach(cb => cb.onchange = () => { setLatest(cb.dataset.latest, cb.checked); rerender(); });
  root.querySelectorAll('[data-style]').forEach(b => b.onclick = () => {
    const n = nbFor(b.dataset.topic);
    if (b.dataset.style === 'deep') { n.format = 'deep-dive'; n.length = 'long'; }
    else { n.format = 'brief'; n.length = 'default'; }
    rerender();
  });
  root.querySelectorAll('[data-format]').forEach(sel => sel.onchange = () => { nbFor(sel.dataset.format).format = sel.value; rerender(); });
  root.querySelectorAll('[data-length]').forEach(sel => sel.onchange = () => { nbFor(sel.dataset.length).length = sel.value; rerender(); });

function confetti() {

  const colors = ['#b4560f', '#e8944a', '#3f7d3f', '#7db87d', '#c9c3b5', '#fdf0e4'];
  const parts = Array.from({ length: 70 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3, r: Math.random() * 4 + 2, rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, col: colors[Math.floor(Math.random() * colors.length)] }));

    const dt = (now - t0) / 1000;
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of parts) { p.vy += .25; p.x += p.vx; p.y += p.vy; p.rot += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, 1 - dt / 1.3); ctx.fillStyle = p.col; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); }
    if (dt < 1.3) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })(t0);
}

  for (const c of S.data.categories) {
    const items = shown.filter(f => f.category === c.id); if (!items.length) continue;
    html += `<div class="group-head"><h2>${esc(c.label_en)}</h2><span class="ja">${esc(c.label_ja)}</span></div>`;
    for (const f of items) {
      const key = feedKey(f), on = S.sel.has(key), flags = [];
      if (f.status === 'broken') flags.push(`<span class="warnflag">${esc(t('flag_broken'))}</span>`);
      if (f.status === 'stale') flags.push(`<span class="warnflag">${esc(t('flag_stale'))}</span>`);
      if (f.status === 'blocked') flags.push(`<span class="warnflag">${esc(t('flag_blocked'))}</span>`);
      if (f.source_mode === 'text') flags.push(`<span class="warnflag">${esc(t('flag_text'))}</span>`);
      if (f.has_timestamps === false) flags.push(esc(t('flag_nots')));
      if (f.same_as) flags.push(`<span class="warnflag">${esc(t('flag_same'))}</span>`);
      html += `<label class="feed ${on ? 'on' : ''}" data-key="${esc(key)}"><input type="checkbox" ${on ? 'checked' : ''}><div><div class="feed-name">${esc(f.name)}</div><div class="feed-meta"><span class="tag">${esc(f.kind)}</span><span>${esc(f.volume || '?')}</span><span class="sep">·</span>${starHtml(f.radio_friendly)}<span class="sep">·</span><span>${esc(f.language)}</span>${flags.length ? '<span class="sep">·</span>' + flags.join(' ') : ''}</div></div><div class="feed-links"><a href="${esc(f.site)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">site</a><a href="${esc(f.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">feed</a></div></label>`;
    }
  }
  list.innerHTML = html;
  list.querySelectorAll('.feed').forEach(node => node.querySelector('input').onchange = (e) => { const f = S.data.feeds.find(x => feedKey(x) === node.dataset.key); if (f) selectFeed(f, e.target.checked); renderList(); renderPanel(); });
}
function renderPanel() {
  const n = selectedEntries().length, nbs = topicsInUse().length;
  el('selcount').textContent = n ? t('sel', n, nbs) : t('sel_none');
  el('copy').disabled = el('download').disabled = el('share').disabled = !n;
  el('copy').textContent = t('copy'); el('download').textContent = t('download'); el('share').textContent = t('share'); el('clear').textContent = t('clear');
  el('hint').innerHTML = t('hint_' + S.fmt);
  el('formats').innerHTML = Object.keys(BUILDERS).map(k => `<button data-fmt="${k}" aria-pressed="${S.fmt === k}">${esc(t('fmts')[k])}</button>`).join('');
  el('formats').querySelectorAll('button').forEach(b => b.onclick = () => { S.fmt = b.dataset.fmt; renderPanel(); });
  const panel = document.querySelector('.panel'); panel.classList.toggle('has-sel', n > 0); if (!n) panel.classList.remove('open');
  el('paneltoggle').textContent = panel.classList.contains('open') ? t('tap_close') : t('tap_open');
  const builder = n > 0 && (S.fmt === 'yaml' || S.fmt === 'cron');
  el('l-sec-nb').hidden = !(builder && S.fmt === 'yaml'); el('l-sec-basics').hidden = !builder;
  el('l-nb-h').textContent = t('l_nb_h'); el('l-basics-h').textContent = t('l_basics_h'); el('l-warn-h').textContent = t('l_warn_h');
  if (builder && S.fmt === 'yaml') { el('l-nbcards').innerHTML = notebooksHtml(); bindNotebooks(el('l-nbcards'), renderPanel); }
  if (builder) { el('l-basics').innerHTML = basicsHtml('l'); bindBasics('l', () => { refreshQuota('l'); renderOutput(); }); }
  renderOutput();
}
function renderOutput() {
  const n = selectedEntries().length;
  el('out').innerHTML = n ? '' : `<span class="empty">${esc(t('empty'))}</span>`;
  if (n) el('out').textContent = BUILDERS[S.fmt]();
  const w = warningsHtml(); el('l-sec-warn').hidden = !(n && w && (S.fmt === 'yaml' || S.fmt === 'cron')); el('l-warnings').innerHTML = w;
  persist();
}
function renderListChrome() {
  el('q').placeholder = t('list_search'); el('f-radio').textContent = t('f_radio'); el('f-quiet').textContent = t('f_quiet');
  el('f-lang').textContent = t('f_lang')[S.lang_filter];
  el('l-custom').innerHTML = customHtml('l'); bindCustom('l', () => { renderList(); renderPanel(); });
}

// ============================================================================
// Chrome: header, mode, language
// ============================================================================
function renderChrome() {
  document.documentElement.lang = S.lang;
  el('tagline').innerHTML = t('tagline');
  const ok = S.data.feeds.filter(f => f.status === 'ok').length;
  el('headcount').textContent = t('headcount', S.data.feeds.length, ok);
  el('mode-guided').textContent = t('mode_guided'); el('mode-list').textContent = t('mode_list');
  el('mode-guided').setAttribute('aria-pressed', S.mode === 'guided'); el('mode-list').setAttribute('aria-pressed', S.mode === 'list');
  el('lang-ja').setAttribute('aria-pressed', S.lang === 'ja'); el('lang-en').setAttribute('aria-pressed', S.lang === 'en');
  el('footer').innerHTML = t('footer');
  el('guided').hidden = S.mode !== 'guided'; el('listmode').hidden = S.mode !== 'list';
}
function renderMode() { if (S.mode === 'guided') renderGuided(); else { renderListChrome(); renderChips(); renderList(); renderPanel(); } }
function setMode(m) { S.mode = m; renderChrome(); renderMode(); persist(); }
function setLang(l) { S.lang = l; renderChrome(); renderMode(); persist(); }
el('mode-guided').onclick = () => setMode('guided'); el('mode-list').onclick = () => setMode('list');
el('lang-ja').onclick = () => setLang('ja'); el('lang-en').onclick = () => setLang('en');
el('theme').onclick = () => { const dark = matchMedia('(prefers-color-scheme: dark)').matches; const now = document.documentElement.getAttribute('data-theme') || (dark ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', now === 'dark' ? 'light' : 'dark'); };
el('q').oninput = (e) => { S.q = e.target.value.trim().toLowerCase(); renderList(); };
el('f-radio').onclick = (e) => { S.radio = !S.radio; e.currentTarget.setAttribute('aria-pressed', S.radio); renderList(); };
el('f-quiet').onclick = (e) => { S.quiet = !S.quiet; e.currentTarget.setAttribute('aria-pressed', S.quiet); renderList(); };
el('f-lang').onclick = (e) => { S.lang_filter = { all: 'en', en: 'ja', ja: 'all' }[S.lang_filter]; e.currentTarget.textContent = t('f_lang')[S.lang_filter]; e.currentTarget.setAttribute('aria-pressed', S.lang_filter !== 'all'); renderList(); };
el('clear').onclick = (e) => { e.stopPropagation(); S.sel.clear(); S.custom = []; S.notebooks = {}; renderList(); renderPanel(); };
el('panelhead').onclick = () => { const p = document.querySelector('.panel'); const open = p.classList.toggle('open'); el('paneltoggle').textContent = open ? t('tap_close') : t('tap_open'); };
el('copy').onclick = (e) => copyText(BUILDERS[S.fmt](), e.currentTarget, t('copied'), t('copy'));
el('download').onclick = () => downloadText(BUILDERS[S.fmt](), FILENAMES[S.fmt]);
el('share').onclick = (e) => shareLink(e.currentTarget);
document.addEventListener('keydown', (e) => {
  if (S.mode !== 'guided' || !S.started) return;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowRight' && S.step < 3 && selectedEntries().length) goStep(S.step + 1);
  if (e.key === 'ArrowLeft' && S.step > 0) goStep(S.step - 1);
});

fetch('feeds.json').then(r => r.json()).then(data => {
  S.data = data; S.data.tags = data.tags || []; S.data.packs = data.packs || [];
  loadPersisted();
  renderChrome();
  renderMode();
}).catch(() => { el('guided').innerHTML = '<p class="noresults">Could not load feeds.json.</p>'; });
</script>
</body>
</html>
